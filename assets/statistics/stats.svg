<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #BC8CFF; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #E6EDF3; }
    .bold { font-weight: 700; fill: #58A6FF; }
    .icon { fill: #BC8CFF; }
    .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #FFFFFF; }
    .rank-circle-rim { stroke: #BC8CFF; fill: none; stroke-width: 6; opacity: 0.25; }
    .rank-circle { stroke: #BC8CFF; stroke-dasharray: 250; fill: none; stroke-width: 6; stroke-linecap: round; opacity: 0.9; }
  </style>

  <rect width="466" height="194" rx="8.5" fill="#010409" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Vipul's GitHub Stats</text>
  </g>

  <!-- Stats Rows -->
  <g transform="translate(25, 45)">
    <!-- Stars -->
    <g transform="translate(0, 20)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
      </svg>
      <text x="25" y="12.5" class="stat">Total Stars Earned:</text>
      <text x="180" y="12.5" class="stat bold">0</text>
    </g>

    <!-- Commits -->
    <g transform="translate(0, 45)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M10.5 7.75a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm1.43.75a4.002 4.002 0 01-7.86 0H.75a.75.75 0 110-1.5h3.32a4.001 4.001 0 017.86 0h3.32a.75.75 0 110 1.5h-3.32z"/>
      </svg>
      <text x="25" y="12.5" class="stat">Total Commits:</text>
      <text x="180" y="12.5" class="stat bold">11</text>
    </g>

    <!-- PRs -->
    <g transform="translate(0, 70)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5z"/>
      </svg>
