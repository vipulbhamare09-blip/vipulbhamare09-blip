  <!-- Rank Circle -->
  <g transform="translate(380, 95)">
    <circle class="rank-circle-rim" cx="0" cy="0" r="40"/>
    <circle class="rank-circle" cx="0" cy="0" r="40" stroke-dashoffset="120"/>
    <text x="0" y="9" text-anchor="middle" class="rank-text">B</text>
  </g>
</svg>