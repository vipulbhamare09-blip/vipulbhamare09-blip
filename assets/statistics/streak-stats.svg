<svg xmlns="http://www.w3.org/2000/svg" width="467" height="160" viewBox="0 0 467 160">
  <rect width="466" height="158" rx="8.5" fill="#010409" stroke="#30363D" stroke-width="1"/>
  
  <!-- Left: Total Contributions -->
  <g transform="translate(75, 55)" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#E6EDF3">11</text>
    <text x="0" y="24" font-size="12" font-weight="600" fill="#BC8CFF">Total Contributions</text>
    <text x="0" y="42" font-size="10" fill="#8B949E">Oct 14, 2025 - Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="155" y1="30" x2="155" y2="130" stroke="#21262D" stroke-width="1"/>

  <!-- Center: Current Streak -->
  <g transform="translate(233, 40)" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif">
    <circle cx="0" cy="35" r="30" fill="none" stroke="#21262D" stroke-width="4"/>
    <circle cx="0" cy="35" r="30" fill="none" stroke="#BC8CFF" stroke-width="4" stroke-dasharray="140 188"/>
    <text x="0" y="42" font-size="22" font-weight="800" fill="#58A6FF">1</text>
    <text x="0" y="80" font-size="12" font-weight="600" fill="#BC8CFF">Current Streak</text>
    <text x="0" y="98" font-size="10" fill="#8B949E">Nov 3, 2026</text>
  </g>

  <!-- Divider 2 -->
  <line x1="312" y1="30" x2="312" y2="130" stroke="#21262D" stroke-width="1"/>

  <!-- Right: Longest Streak -->
  <g transform="translate(390, 55)" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#E6EDF3">5</text>
    <text x="0" y="24" font-size="12" font-weight="600" fill="#BC8CFF">Longest Streak</text>
    <text x="0" y="42" font-size="10" fill="#8B949E">Active Contributor</text>
  </g>
</svg>